        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.72a1.48 1.48 0 1 0 0 2.95 1.48 1.48 0 0 0 0-2.95Z"/>
      </svg>

    const GithubIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="currentColor" viewBox="0 0 24 24">
        <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
    );

    const MailIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    );

    const DEFAULT_EXPERIMENTS = [
      {
        "id": "SAFFIRE-I",
        "title": "Saffire-I Large-Scale Flame Spread over SIBAL Fabric",
        "mission_program": "Saffire",
        "facility_platform": "Cygnus OA-6 free-flyer (2016)",
        "gravity_g": 0.0,
        "oxygen_pct": 21.0,
        "airflow_cms": 20.0,
        "fuel_material": "SIBAL cloth (75% cotton / 25% fiberglass), 41 cm x 94 cm",
        "flame_spread_rate_mms": 3.2,
        "extinction_behavior": "Flame reached steady size instead of growing continuously; burn lasted ~400 s",
        "source_report": "https://ntrs.nasa.gov/api/citations/20210011521/downloads/ICES%202021-266%200503-2021%20final.pdf",
        "nasa_citation": "Urban et al., ICES-2021-266, Table 2; Saffire I-III results slides"
      }
    ];

    /* Map investigations.json program names to display-friendly filter names */
    const PROG_MAP = {
      'Saffire': 'Saffire',
      'MSG': 'BASS',
      'MDCA': 'FLEX',
      'SoFIE': 'SoFIE',
      'ACME': 'ACME',
      'Smoke': 'Smoke',
      'Modeling': 'Modeling'
    };

    /* Map a raw investigations.json record to the experiment shape used by the UI.
       Preserves ALL rich fields so Dossier, chart, and AI can use them. */
    function mapInvestigation(item) {
      return {
        id: item.id,
        title: item.name || item.id,
        mission_program: PROG_MAP[item.prog] || item.prog || 'NASA',
        facility_platform: item.platform || 'ISS',
        hardware: item.hardware || '',
        gravity_g: 0.0,
        oxygen_pct: Number(item.o2) || null,
        pressure_kpa: item.pressure_kpa != null ? Number(item.pressure_kpa) : null,
        airflow_cms: Number(item.flow) || null,
        fuel_material: item.fuel || 'Solid/Gas',
        fuel_state: item.fuel_state || '',
        flame_spread_rate_mms: Number(item.flame_len) || null,
        spread: item.spread || null,
        extinction_behavior: item.ext || item.summary || 'Test recorded',
        source_report: item.url || (item.sources && item.sources[0]?.url) || '#',
        nasa_citation: item.cite || (item.sources && item.sources[0]?.title) || 'NASA PSI',
        summary: item.summary || '',
        key_findings: item.key_findings || [],
        tags: item.tags || [],
        tests: item.tests || [],
        data_gaps: item.data_gaps || [],
        sensors: item.sensors || '',
        fire_relevance: item.fire_relevance || '',
        environments: item.environments || [],
        sources: item.sources || [],
        verified: item.verified || '',
        status: item.status || '',
        psi_listed: item.psi_listed || false
      };
    }

    function calculateRisk(item) {
      const o2 = Number(item.oxygen_pct) || 21;
      const spread = Number(item.flame_spread_rate_mms) || 0.5;
      const flow = Number(item.airflow_cms) || 0;
      const score = (o2 * 0.12) + (spread * 1.3) + (flow * 0.03);
      return Math.min(10, Math.max(1, parseFloat(score.toFixed(1))));
    }

    function hasNumericData(item) {
      // Both axes must be present to plot a meaningful point
      return item.airflow_cms != null && item.airflow_cms > 0 && item.flame_spread_rate_mms != null && item.flame_spread_rate_mms > 0;
    }

    function getPopStyle(score) {
      if (score >= 6.5) return { 
        badgeBg: 'bg-rose-100 text-black border-2 border-black shadow-pop-sm', 
        tag: 'CRITICAL',
        chartFill: '#FF4D6D' 
      };
      if (score >= 4.0) return { 
        badgeBg: 'bg-popyellow text-black border-2 border-black shadow-pop-sm', 
        tag: 'ELEVATED',
        chartFill: '#FFE600' 
      };
      return { 
        badgeBg: 'bg-popmint text-black border-2 border-black shadow-pop-sm', 
        tag: 'NOMINAL',
        chartFill: '#2EC4B6' 
      };
    }

    function Header({ filter, setFilter, onTriggerAi }) {
      return (
        <header className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-8 pb-4">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-2xl font-black tracking-tight text-black flex items-center gap-1.5">
                <FlameIcon className="w-7 h-7 text-black fill-popyellow stroke-[2.5]" />
                IGNIS.
              </span>
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border-2 border-black bg-white shadow-pop-sm text-xs font-bold">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                NASA Microgravity SFS
              </span>
            </div>
            <p className="text-xs font-semibold text-slate-700">
              Exploration Spacecraft Materials Fire Safety Intelligence Hub
            </p>
          </div>

          <div className="flex items-center gap-3">
            <div className="hidden sm:flex items-center gap-2 bg-white px-3 py-1.5 rounded-full border-2 border-black shadow-pop-sm text-xs font-bold flex-wrap">
              {['ALL', 'Saffire', 'BASS', 'FLEX', 'SoFIE', 'ACME', 'Smoke'].map((prog) => (
                <button
                  key={prog}
                  onClick={() => { setFilter(prog); setHighlightedIds([]); setGraphNote(null); }}
                  className={`px-3 py-1 rounded-full transition-all ${
                    filter === prog 
                      ? 'bg-black text-white' 
                      : 'text-black hover:bg-cream-200'
                  }`}
                >
                  {prog}
                </button>
              ))}
            </div>
            
            <button 
              onClick={onTriggerAi}
              className="pop-btn px-5 py-2.5 rounded-full bg-popyellow text-black font-extrabold text-xs border-2 border-black shadow-pop flex items-center gap-2"
            >
              <BotIcon className="w-4 h-4" />
              <span>AI Synthesis</span>
              <ArrowRightIcon className="w-3.5 h-3.5" />
            </button>
          </div>
        </header>
      );
    }

    function HeroSection({ selectedExp, setQuestion, totalExperiments }) {
      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8 items-center bg-white p-6 md:p-8 rounded-3xl border-2 border-black shadow-pop-lg">
          <div className="lg:col-span-8">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full border-2 border-black bg-popgreen shadow-pop-sm text-xs font-bold mb-3">
              <RocketIcon className="w-3.5 h-3.5 text-emerald-800" />
              <span>Synthesizing Microgravity Combustion Archives</span>
            </div>
            <h2 className="text-3xl md:text-4xl font-extrabold text-black tracking-tight leading-tight mb-3">
              Fire behaves differently when <span className="bg-popyellow px-2 py-0.5 rounded-md border-2 border-black inline-block shadow-pop-sm">gravity is zero.</span>
            </h2>
            <p className="text-sm text-slate-700 font-medium max-w-2xl leading-relaxed mb-4">
              Without buoyant buoyancy convection, flames do not rise. They form spherical diffuse pockets, emit invisible cool flames, and rely entirely on ventilation fans to sustain propagation or extinguish.
            </p>
            
            <div className="flex flex-wrap items-center gap-3">
              <a 
                href="#dataset-matrix"
                className="pop-btn px-5 py-2.5 rounded-full bg-popyellow border-2 border-black shadow-pop text-xs font-black text-black inline-flex items-center gap-2"
              >
                <FireSparkleIcon className="w-4 h-4" />
                <span>Explore {totalExperiments || 7} Test Datasets</span>
              </a>
              <button 
                onClick={() => processQuery("What is the Limiting Oxygen Concentration and how does it relate to flammability in microgravity?")}
                className="pop-btn px-5 py-2.5 rounded-full bg-white border-2 border-black shadow-pop text-xs font-black text-black flex items-center gap-1.5"
              >
                <span>View Flammability Limits</span>
                <ArrowRightIcon className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          <div className="lg:col-span-4 flex justify-center">
            <div className="relative">
              <div className="absolute -bottom-2 -right-2 w-full h-full bg-poppink rounded-2xl border-2 border-black"></div>
              <div className="relative bg-black text-white p-5 rounded-2xl border-2 border-black shadow-pop w-64 text-center">
                <div className="text-[10px] font-mono text-popyellow tracking-widest uppercase mb-1">Active Benchmark</div>
                {selectedExp?.flame_spread_rate_mms != null ? (
                  <div className="text-3xl font-black mb-1 flex items-center justify-center gap-1">
                    {selectedExp.flame_spread_rate_mms} 
                    <span className="text-xs font-normal text-slate-300">cm flame</span>
                  </div>
                ) : selectedExp?.oxygen_pct != null ? (
                  <div className="text-3xl font-black mb-1 flex items-center justify-center gap-1">
                    {selectedExp.oxygen_pct}
                    <span className="text-xs font-normal text-slate-300">% O₂</span>
                  </div>
                ) : (
                  <div className="text-2xl font-black mb-1">{selectedExp?.id || '—'}</div>
                )}
                <div className="text-xs font-bold text-slate-300 truncate mb-3">{selectedExp?.fuel_material || selectedExp?.fuel || 'Solid Specimen'}</div>
                <div className="inline-block bg-popyellow text-black text-[11px] font-extrabold px-3 py-1 rounded-full border border-black">
                  {selectedExp?.mission_program || selectedExp?.prog || 'NASA'} Platform
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ScatterPlotCard({ chartData, setSelectedExp, filter, graphNote, highlightedIds }) {
      const programInfo = {
        'BASS': { label: 'BASS (Burning and Suppression of Solids)', desc: 'Studies flame spread over thin fuels and material flammability on ISS. Measures flame appearance, ignition, and suppression — not continuous airflow vs. flame-length curves.' },
        'FLEX': { label: 'FLEX (Droplet Combustion)', desc: 'Studies isolated fuel-droplet burning and cool-flame phenomena in microgravity using the MDCA apparatus. Measures droplet diameter and burning rate, not airflow propagation.' },
        'SoFIE': { label: 'SoFIE (Solid Fuel Ignition & Extinction)', desc: 'Studies ignition and extinction limits of solid fuels under controlled O₂ and flow on ISS. Quantitative flow/flame data is pending extraction from NASA PSI.' },
        'ACME': { label: 'ACME (Advanced Combustion)', desc: 'Studies gas-phase flames (cool flames, soot, electric-field effects) inside the CIR on ISS. Uses gaseous fuels, not solid-fuel propagation measurements.' },
        'Smoke': { label: 'Smoke Detection Research', desc: 'Studies smoke-particle characteristics to improve spacecraft smoke detectors. Focuses on particle size and detector response, not flame propagation.' },
        'Modeling': { label: 'Computational Modeling', desc: 'Numerical studies to validate and extend experimental findings. No direct experimental airflow/flame measurements.' }
      };
      const info = programInfo[filter];
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop">

    // ─── HARD-CODED DEMO Q&A DATABASE ──────────────────────────────────────────
    // Each entry: { triggers[], answer, graphHighlight? }
    // graphHighlight can be: { ids[], focusFilter, chartNote }
    const DEMO_QA = [
      {
        // Q1 — Airflow & flame spread
        triggers: ['airflow', 'flame spread', 'how does airflow', 'affect flame'],
        answer: `🔥 Great question! Think of airflow like blowing on a campfire — but in space it works a little differently.

On Earth, hot air naturally rises (that's convection), which feeds oxygen to a flame. In space there's no gravity pulling things down, so hot air goes nowhere. That means fire in microgravity is totally dependent on the ventilation fans to get fresh oxygen.

Here's what the Saffire experiments showed us:

📊 Low airflow (5–10 cm/s) → Flames stay small and can self-extinguish
📊 Medium airflow (15–20 cm/s) → Flames reach a steady size (~4 cm long) and keep burning
📊 High airflow (25–30 cm/s) → Flames grow larger and spread faster (~10 mm/s)

The scatter chart below shows this relationship — the further right a dot is, the faster the airflow; the higher the dot, the faster the flame spread. See how they go up together?

        if (/^(hi|hello|hey|howdy|good\s|yo|hola|greetings|namaste|assalamu|salam)/i.test(lower.trim())) {
          return {
            text: `Hello! 👋 I'm IGNIS, your AI-powered microgravity fire research assistant, built by team Off_Script for the NASA App Development Challenge.\n\nI have access to ${exps.length} investigations spanning programs like Saffire, BASS, FLEX, SoFIE, and ACME. I can help you explore specific experiments, compare fire behavior under different conditions, or explain how fire works differently in space.\n\nWhat would you like to know?`,
            sources: []
          };
        }

        // Who/what are you
        if (lower.includes('who are you') || lower.includes('what are you') || lower.includes('introduce yourself') || lower.includes('your name')) {
          return {
            text: `I'm IGNIS, an AI-powered NASA microgravity fire research and safety intelligence assistant. I was built by team Off_Script for the NASA App Development Challenge.\n\nI have access to ${exps.length} investigations from programs including:\n→ Saffire: Large-scale fire tests on Cygnus spacecraft\n→ BASS: Burning and suppression of solids on ISS\n→ FLEX: Droplet combustion and cool flame phenomena\n→ SoFIE: Solid fuel ignition and extinction\n→ ACME: Advanced combustion experiments on ISS\n→ Smoke: Smoke detection research\n\nI can search experiments, compare conditions, explain findings, and always cite my data sources. What interests you?`,
            sources: []
          };
        }

        // What can you do / help
        if (lower.includes('what can you do') || lower.includes('how can you help') || lower.includes('what can you help') || lower.includes('how do i use') || lower.includes('capabilities')) {
          return {
            text: `Here's what I can help you with:\n\n→ Search and explore ${exps.length} microgravity fire research investigations\n→ Explain experiment conditions — oxygen levels, airflow speeds, fuel types, and flame behavior\n→ Compare different experiments (e.g., Saffire-IV vs. Saffire-V)\n→ Discuss how fire behaves differently in zero gravity — cool flames, flame spread, extinction\n→ Explain the research programs: Saffire, BASS, FLEX, SoFIE, ACME, Smoke\n→ Provide findings with source references and NASA citations\n\nYou can also use the filter pills at the top of the dashboard to narrow experiments by program, or click any experiment card for its full details.\n\nTry asking me about a specific experiment, program, or concept!`,
            sources: []
          };
        }

        if (lower.includes('help me')) {
          return {
            text: `Of course! I'm here to help you explore NASA's microgravity fire safety research. Here are some things you can ask me:\n\n→ "Tell me about Saffire experiments"\n→ "How does airflow affect flame spread in microgravity?"\n→ "Compare Saffire-IV and Saffire-V"\n→ "What are cool flames?"\n→ "How does oxygen level affect fire danger in spacecraft?"\n\nOr try the quick-action buttons below for instant answers on common topics!`,
            sources: []
          };
        }

        if (lower.includes('how are you') || lower.includes('sup') || lower.includes("what's up")) {
          return {
            text: `I'm doing great, thanks for asking! 🔥 I'm ready to help you explore microgravity fire safety research. We have ${exps.length} investigations loaded — got any questions about spacecraft combustion experiments?`,
            sources: []
          };
        }

        if (lower.includes('thank') || lower.includes('awesome') || lower.includes('great job') || lower.includes('nice work')) {
          return {
            text: `You're welcome! Happy to help. Feel free to ask me anything else about microgravity fire research. 🔥`,
            sources: []
          };
        }

        if (lower.includes('bye') || lower.includes('goodbye') || lower.includes('see you')) {
          return {
            text: `Goodbye! Feel free to come back anytime you want to explore fire safety research. Stay safe! 👋`,
            sources: []
          };
        }

        if (lower.includes('who made you') || lower.includes('who built you') || lower.includes('who created you') || lower.includes('off_script') || lower.includes('off script') || lower.includes('your team')) {
          return {
            text: `I was created by team Off_Script for the NASA App Development Challenge. Our mission is to make microgravity fire safety research accessible and intelligent for researchers and engineers working on future spacecraft and habitats.\n\nThe IGNIS dashboard synthesizes data from NASA's Physical Sciences Informatics (PSI) database and published research papers into an interactive, AI-powered research tool.`,
            sources: []
          };
        }

        // Research questions — search through data
        const hits = localSearch(q, exps);
        
        if (hits.length === 0) {
          // Still try to give a helpful response about general concepts
          if (lower.includes('microgravity') || lower.includes('zero gravity') || lower.includes('space')) {
            return {
              text: `In microgravity, fire behaves very differently than on Earth. Without buoyancy-driven convection, flames don't rise — instead they form spherical shapes around their fuel source. This changes everything about how fires spread, how hot they get, and how to extinguish them.\n\nOur database covers ${exps.length} investigations studying these phenomena. The Saffire program conducted the first large-scale fire tests on uncrewed Cygnus spacecraft, FLEX studied cool flames in droplet combustion, and SoFIE examines ignition and extinction of solid fuels.\n\nWant to dive into a specific program or experiment?`,
              sources: []
            };
          }
          return {
            text: `I searched our ${exps.length} investigations but couldn't find a strong match for that specific query. Here are some topics I can help with:\n\n• Saffire experiments — large-scale fire tests on Cygnus spacecraft\n• BASS — burning and suppression of solids on ISS\n• FLEX — droplet combustion and cool flame phenomena\n• SoFIE — solid fuel ignition and extinction\n• ACME — advanced combustion experiments\n• Smoke detection research\n\nTry rephrasing your question or ask about one of these programs!`,
            sources: []
          };
        }

        // Build a data-driven answer from the hits
        let answer = '';
        const sourceIds = hits.map(h => h.id);

        // Check for specific patterns to give structured answers
        if (lower.includes('compare') || lower.includes('difference') || lower.includes(' vs ') || lower.includes('versus')) {
          answer = `Here's a comparison of the relevant experiments I found:\n\n`;
          hits.forEach(h => {
            answer += `${h.id} (${h.mission_program}): ${h.summary || h.title}`;
            if (h.oxygen_pct != null) answer += ` O2: ${h.oxygen_pct}%`;
            if (h.airflow_cms != null) answer += `, Airflow: ${h.airflow_cms} cm/s`;
            if (h.flame_spread_rate_mms != null) answer += `, Flame length: ${h.flame_spread_rate_mms} cm`;
            answer += '\n\n';
            if (h.key_findings && h.key_findings.length > 0) {
              answer += `Key findings: ${h.key_findings[0]}\n\n`;
            }
          });
        } else if (lower.includes('overview') || lower.includes('summary') || lower.includes('tell me about')) {
          const firstHit = hits[0];
          answer = `${firstHit.title} [${firstHit.id}]\n\n`;
          if (firstHit.summary) answer += `${firstHit.summary}\n\n`;
          if (firstHit.oxygen_pct != null || firstHit.airflow_cms != null) {
            answer += 'Conditions: ';
            if (firstHit.oxygen_pct != null) answer += `${firstHit.oxygen_pct}% O2`;
            if (firstHit.airflow_cms != null) answer += `, ${firstHit.airflow_cms} cm/s airflow`;
            if (firstHit.flame_spread_rate_mms != null) answer += `, flame length ${firstHit.flame_spread_rate_mms} cm`;
            answer += `\nPlatform: ${firstHit.facility_platform}\n`;
            if (firstHit.hardware) answer += `Hardware: ${firstHit.hardware}\n`;
            answer += '\n';
          }
          if (firstHit.key_findings && firstHit.key_findings.length > 0) {
            answer += 'Key findings:\n';
            firstHit.key_findings.forEach(f => { answer += `→ ${f}\n`; });
            answer += '\n';
          }
          if (firstHit.extinction_behavior) answer += `Behavior: ${firstHit.extinction_behavior}\n\n`;
          if (firstHit.fire_relevance) answer += `Fire safety relevance: ${firstHit.fire_relevance}\n`;
          if (hits.length > 1) {
            answer += `\nRelated experiments: ${hits.slice(1).map(h => `[${h.id}]`).join(' ')}`;
          }
        } else {
          // General research answer
          answer = `Based on our database, here's what I found:\n\n`;
          hits.forEach(h => {
            answer += `[${h.id}] ${h.title}\n`;
            if (h.summary) answer += `${h.summary}\n`;
            if (h.key_findings && h.key_findings.length > 0) {
              answer += `Key finding: ${h.key_findings[0]}\n`;
            }
            if (h.oxygen_pct != null) answer += `O2: ${h.oxygen_pct}%`;
            if (h.airflow_cms != null) answer += ` | Airflow: ${h.airflow_cms} cm/s`;
            if (h.flame_spread_rate_mms != null) answer += ` | Flame length: ${h.flame_spread_rate_mms} cm`;
            if (h.oxygen_pct != null || h.airflow_cms != null) answer += '\n';
            answer += '\n';
          });
          if (hits.length > 0 && hits[0].fire_relevance) {
            answer += `Fire safety relevance: ${hits[0].fire_relevance}`;
          }
        }

        return { text: answer.trim(), sources: sourceIds };
      }

      // Connects to backend /api/chat with conversation history
      const processQuery = async (queryText) => {
        const q = queryText.trim();
        if (!q) return;

        // Add user message to chat
        const userMsg = { role: 'user', text: q };
        setChatMessages(prev => [...prev, userMsg]);
        setIsQuerying(true);

        // ── CHECK HARD-CODED DEMO Q&A FIRST ─────────────────────────────────
        const demoMatch = matchDemoQA(q);
        if (demoMatch) {
          // Show "thinking..." bubble immediately
          const thinkingId = Date.now();
          setChatMessages(prev => [...prev, {
            role: 'assistant',
            text: '🤔 Thinking...',
            isThinking: true,
            id: thinkingId,
            sources: []
          }]);

          // Realistic 1.6-second thinking delay
          await new Promise(r => setTimeout(r, 1600));

          // Apply graph highlight if present
          if (demoMatch.graphHighlight) {
            const { ids, focusFilter, chartNote } = demoMatch.graphHighlight;
            if (focusFilter && focusFilter !== 'ALL') setFilter(focusFilter);
            setHighlightedIds(ids || []);
            setGraphNote(chartNote || null);
          }

          // Replace thinking bubble with real answer
          setChatMessages(prev =>
            prev.filter(m => !m.isThinking).concat([{
              role: 'assistant',
              text: demoMatch.answer,
              sources: []
            }])
          );
          setIsQuerying(false);
          return;
        }
        // ────────────────────────────────────────────────────────────────────

        // Show thinking for backend/local fallback too
        setChatMessages(prev => [...prev, {
          role: 'assistant',
          text: '🤔 Thinking...',
          isThinking: true,
          sources: []
        }]);

        try {
          // Build history from recent messages for context
          const recentHistory = chatMessages.slice(-6).map(m => ({
            role: m.role === 'assistant' ? 'assistant' : 'user',
            text: m.text
          }));

          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: q, history: recentHistory })
          });

          if (res.ok) {
            const data = await res.json();
            if (data.answer) {
              setChatMessages(prev =>
                prev.filter(m => !m.isThinking).concat([{
                  role: 'assistant',
                  text: data.answer,
                  sources: data.sources || []
                }])
              );
              setIsQuerying(false);
              return;
            }
          }
        } catch (err) {
          console.warn("Backend chat unavailable, using local synthesis:", err);
        }

        // Smart local fallback using loaded experiments data
        await new Promise(r => setTimeout(r, 900));
        const localResult = buildLocalAnswer(q, experiments);
        setChatMessages(prev =>
          prev.filter(m => !m.isThinking).concat([{
            role: 'assistant',
            text: localResult.text,
            sources: localResult.sources
          }])
        );
        setIsQuerying(false);
      };

      const handleAsk = (e, customQuery) => {
        if (e) e.preventDefault();
        const queryToRun = customQuery || question;
        if (!queryToRun.trim()) return;
        processQuery(queryToRun);
        setQuestion('');
      };

      const triggerMove = (moveName) => {
        processQuery(moveName);
      };

      return (
        <div className="max-w-[1340px] mx-auto px-4 py-8 md:px-8">
          <Header 
            filter={filter} 
            setFilter={(f) => { setFilter(f); setHighlightedIds([]); setGraphNote(null); }} 
            onTriggerAi={() => {
              processQuery("Give me a quick overview of fire safety research in microgravity.");
            }}
          />

          <HeroSection 
            selectedExp={selectedExp} 
            setQuestion={setQuestion} 
            totalExperiments={experiments.length}
          />

          <div id="dataset-matrix" className="grid grid-cols-12 gap-6 items-start">
            <div className="col-span-12 lg:col-span-7 flex flex-col gap-6">
              <AiCopilotCard 
                chatMessages={chatMessages}
                question={question}
                setQuestion={setQuestion}
                handleAsk={handleAsk}
                triggerMove={triggerMove}
                isQuerying={isQuerying}
              />
              <ScatterPlotCard 
                chartData={chartData} 
                setSelectedExp={setSelectedExp}
                filter={filter}
                graphNote={graphNote}
                highlightedIds={highlightedIds}
              />
            </div>

            <div className="col-span-12 lg:col-span-5 flex flex-col gap-6">
              <DossierCard selectedExp={selectedExp} />
              <ExperimentList 
                filteredList={filteredList}
                search={search}
                setSearch={setSearch}
                selectedExp={selectedExp}
                setSelectedExp={setSelectedExp}
              />
            </div>
          </div>

          <Footer />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
