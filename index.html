    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #FAF6EE; }
    ::-webkit-scrollbar-thumb { background: #111111; border-radius: 9999px; }

</head>
<body class="font-sans antialiased selection:bg-popyellow selection:text-black">

  <!-- Pastel Floating Bokeh Blobs -->

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const {

    /* Dynamic Fire Flame Icon */

    const FireSparkleIcon = ({ className = "w-4 h-4" }) => (

    const ExternalLinkIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">

    const WindIcon = ({ className = "w-4 h-4" }) => (

    const ShieldAlertIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

    const RocketIcon = ({ className = "w-4 h-4" }) => (

        <path strokeLinecap="round" strokeLinejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 006.16-12.12c-3.23.1-7.23 1.87-10.16 4.8m4 7.32l-4-4m-6.24 6.24c-1.56 1.56-4.1 1.56-5.66 0 0 0 1.56-4.1 3.12-5.66l2.54 2.54m0 0l3.12 3.12" />
      </svg>
    );

    const TwitterIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="currentColor" viewBox="0 0 24 24">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    );

    const LinkedinIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="currentColor" viewBox="0 0 24 24">
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.72a1.48 1.48 0 1 0 0 2.95 1.48 1.48 0 0 0 0-2.95Z"/>
      </svg>
    );

    const GithubIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="currentColor" viewBox="0 0 24 24">
        <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
    );

    const MailIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    );

    const DEFAULT_EXPERIMENTS = [
      {
        "id": "SAFFIRE-I",
        "title": "Saffire-I Large-Scale Flame Spread over SIBAL Fabric",
        "mission_program": "Saffire",
        "facility_platform": "Cygnus OA-6 free-flyer (2016)",
        "gravity_g": 0.0,
        "oxygen_pct": 21.0,
        "airflow_cms": 20.0,
        "fuel_material": "SIBAL cloth (75% cotton / 25% fiberglass), 41 cm x 94 cm",
        "flame_spread_rate_mms": 3.2,
        "extinction_behavior": "Flame reached steady size instead of growing continuously; burn lasted ~400 s",
        "source_report": "https://ntrs.nasa.gov/api/citations/20210011521/downloads/ICES%202021-266%200503-2021%20final.pdf",
        "nasa_citation": "Urban et al., ICES-2021-266, Table 2; Saffire I-III results slides"
      }
    ];

    /* Map investigations.json program names to display-friendly filter names */
    const PROG_MAP = {
      'Saffire': 'Saffire',
      'MSG': 'BASS',
      'MDCA': 'FLEX',
      'SoFIE': 'SoFIE',
      'ACME': 'ACME',
      'Smoke': 'Smoke',
      'Modeling': 'Modeling'
    };

    /* Map a raw investigations.json record to the experiment shape used by the UI.
       Preserves ALL rich fields so Dossier, chart, and AI can use them. */
    function mapInvestigation(item) {
      return {
        id: item.id,
        title: item.name || item.id,
        mission_program: PROG_MAP[item.prog] || item.prog || 'NASA',
        facility_platform: item.platform || 'ISS',
        hardware: item.hardware || '',
        gravity_g: 0.0,
        oxygen_pct: Number(item.o2) || null,
        pressure_kpa: item.pressure_kpa != null ? Number(item.pressure_kpa) : null,
        airflow_cms: Number(item.flow) || null,
        fuel_material: item.fuel || 'Solid/Gas',
        fuel_state: item.fuel_state || '',
        flame_spread_rate_mms: Number(item.flame_len) || null,
        spread: item.spread || null,
        extinction_behavior: item.ext || item.summary || 'Test recorded',
        source_report: item.url || (item.sources && item.sources[0]?.url) || '#',
        nasa_citation: item.cite || (item.sources && item.sources[0]?.title) || 'NASA PSI',
        summary: item.summary || '',
        key_findings: item.key_findings || [],
        tags: item.tags || [],
        tests: item.tests || [],
        data_gaps: item.data_gaps || [],
        sensors: item.sensors || '',
        fire_relevance: item.fire_relevance || '',
        environments: item.environments || [],
        sources: item.sources || [],
        verified: item.verified || '',
        status: item.status || '',
        psi_listed: item.psi_listed || false
      };
    }

    function calculateRisk(item) {
      const o2 = Number(item.oxygen_pct) || 21;
      const spread = Number(item.flame_spread_rate_mms) || 0.5;
      const flow = Number(item.airflow_cms) || 0;
      const score = (o2 * 0.12) + (spread * 1.3) + (flow * 0.03);
      return Math.min(10, Math.max(1, parseFloat(score.toFixed(1))));
    }

    function hasNumericData(item) {
      return item.oxygen_pct != null || item.airflow_cms != null || item.flame_spread_rate_mms != null;
    }

    function getPopStyle(score) {
      if (score >= 6.5) return { 
        badgeBg: 'bg-rose-100 text-black border-2 border-black shadow-pop-sm', 
        tag: 'CRITICAL',
        chartFill: '#FF4D6D' 
      };
      if (score >= 4.0) return { 
        badgeBg: 'bg-popyellow text-black border-2 border-black shadow-pop-sm', 
        tag: 'ELEVATED',
        chartFill: '#FFE600' 
      };
      return { 
        badgeBg: 'bg-popmint text-black border-2 border-black shadow-pop-sm', 
        tag: 'NOMINAL',
        chartFill: '#2EC4B6' 
      };
    }

    function Header({ filter, setFilter, onTriggerAi }) {
      return (
        <header className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-8 pb-4">
          <div>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-2xl font-black tracking-tight text-black flex items-center gap-1.5">
                <FlameIcon className="w-7 h-7 text-black fill-popyellow stroke-[2.5]" />
                IGNIS.
              </span>
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border-2 border-black bg-white shadow-pop-sm text-xs font-bold">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                NASA Microgravity SFS
              </span>
            </div>
            <p className="text-xs font-semibold text-slate-700">
              Exploration Spacecraft Materials Fire Safety Intelligence Hub
            </p>
          </div>

          <div className="flex items-center gap-3">
            <div className="hidden sm:flex items-center gap-2 bg-white px-3 py-1.5 rounded-full border-2 border-black shadow-pop-sm text-xs font-bold flex-wrap">
              {['ALL', 'Saffire', 'BASS', 'FLEX', 'SoFIE', 'ACME', 'Smoke'].map((prog) => (
                <button
                  key={prog}
                  onClick={() => setFilter(prog)}
                  className={`px-3 py-1 rounded-full transition-all ${
                    filter === prog 
                      ? 'bg-black text-white' 
                      : 'text-black hover:bg-cream-200'
                  }`}
                >
                  {prog}
                </button>
              ))}
            </div>
            
            <button 
              onClick={onTriggerAi}
              className="pop-btn px-5 py-2.5 rounded-full bg-popyellow text-black font-extrabold text-xs border-2 border-black shadow-pop flex items-center gap-2"
            >
              <BotIcon className="w-4 h-4" />
              <span>AI Synthesis</span>
              <ArrowRightIcon className="w-3.5 h-3.5" />
            </button>
          </div>
        </header>
      );
    }

    function HeroSection({ selectedExp, setQuestion, totalExperiments }) {
      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8 items-center bg-white p-6 md:p-8 rounded-3xl border-2 border-black shadow-pop-lg">
          <div className="lg:col-span-8">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full border-2 border-black bg-popgreen shadow-pop-sm text-xs font-bold mb-3">
              <RocketIcon className="w-3.5 h-3.5 text-emerald-800" />
              <span>Synthesizing Microgravity Combustion Archives</span>
            </div>
            <h2 className="text-3xl md:text-4xl font-extrabold text-black tracking-tight leading-tight mb-3">
              Fire behaves differently when <span className="bg-popyellow px-2 py-0.5 rounded-md border-2 border-black inline-block shadow-pop-sm">gravity is zero.</span>
            </h2>
            <p className="text-sm text-slate-700 font-medium max-w-2xl leading-relaxed mb-4">
              Without buoyant buoyancy convection, flames do not rise. They form spherical diffuse pockets, emit invisible cool flames, and rely entirely on ventilation fans to sustain propagation or extinguish.
            </p>
            
            <div className="flex flex-wrap items-center gap-3">
              <a 
                href="#dataset-matrix"
                className="pop-btn px-5 py-2.5 rounded-full bg-popyellow border-2 border-black shadow-pop text-xs font-black text-black inline-flex items-center gap-2"
              >
                <FireSparkleIcon className="w-4 h-4" />
                <span>Explore {totalExperiments || 7} Test Datasets</span>
              </a>
              <button 
                onClick={() => processQuery("What is the Limiting Oxygen Concentration and how does it relate to flammability in microgravity?")}
                className="pop-btn px-5 py-2.5 rounded-full bg-white border-2 border-black shadow-pop text-xs font-black text-black flex items-center gap-1.5"
              >
                <span>View Flammability Limits</span>
                <ArrowRightIcon className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          <div className="lg:col-span-4 flex justify-center">
            <div className="relative">
              <div className="absolute -bottom-2 -right-2 w-full h-full bg-poppink rounded-2xl border-2 border-black"></div>
              <div className="relative bg-black text-white p-5 rounded-2xl border-2 border-black shadow-pop w-64 text-center">
                <div className="text-[10px] font-mono text-popyellow tracking-widest uppercase mb-1">Active Benchmark</div>
                <div className="text-3xl font-black mb-1 flex items-center justify-center gap-1">
                  {selectedExp?.flame_spread_rate_mms ?? '—'} 
                  <span className="text-xs font-normal text-slate-300">{selectedExp?.flame_spread_rate_mms != null ? 'cm' : ''}</span>
                </div>
                <div className="text-xs font-bold text-slate-300 truncate mb-3">{selectedExp?.fuel_material || selectedExp?.fuel || 'Solid Specimen'}</div>
                <div className="inline-block bg-popyellow text-black text-[11px] font-extrabold px-3 py-1 rounded-full border border-black">
                  {selectedExp?.mission_program || selectedExp?.prog || 'NASA'} Platform
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ScatterPlotCard({ chartData, setSelectedExp }) {
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
            <div>
              <h3 className="text-base font-extrabold text-black flex items-center gap-2">
                <WindIcon className="w-4 h-4 text-black" />
                Combustion Propagation Matrix
              </h3>
              <p className="text-xs font-semibold text-slate-600">Airflow Velocity (cm/s) vs. Flame Spread Rate (mm/s)</p>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-popmint border border-black">Low Risk</span>
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-popyellow border border-black">Elevated</span>
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-200 border border-black">Critical</span>
            </div>
          </div>

          <div className="h-64 w-full bg-cream-100 rounded-2xl p-2 border-2 border-black">
            <ResponsiveContainer width="100%" height="100%">
              <ScatterChart margin={{ top: 15, right: 20, bottom: 20, left: -10 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#DDD9CD" />
                <XAxis 
                  type="number" 
                  dataKey="x" 
                  name="Flow" 
                  unit=" cm/s" 
                  stroke="#111" 
                  fontSize={11} 
                  fontWeight={700}
                  domain={[0, 30]} 
                />
                <YAxis 
                  type="number" 
                  dataKey="y" 
                  name="Spread" 
                  unit=" mm/s" 
                  stroke="#111" 
                  fontSize={11} 
                  fontWeight={700}
                  domain={[0, 6]} 
                />
                <ZAxis type="number" dataKey="z" range={[120, 340]} />
                <Tooltip 
                  content={({ active, payload }) => {
                    if (active && payload && payload.length) {
                      const point = payload[0].payload.item;
                      return (
                        <div className="bg-white border-2 border-black p-3 rounded-xl shadow-pop text-xs">
                          <div className="font-extrabold text-black">{point.title}</div>
                          <div className="text-slate-700 mt-1">Airflow: <strong>{point.airflow_cms} cm/s</strong></div>
                          <div className="text-slate-700">Spread: <strong>{point.flame_spread_rate_mms} mm/s</strong></div>
                          <div className="text-slate-700">O₂ Level: <strong>{point.oxygen_pct}%</strong></div>
                        </div>
                      );
                    }
                    return null;
                  }} 
                />
                <Scatter 
                  data={chartData} 
                  onClick={(node) => setSelectedExp(node.item)}
                  cursor="pointer"
                >
                  {chartData.map((entry, index) => {
                    const style = getPopStyle(entry.z);
                    return (
                      <Cell 
                        key={`cell-${index}`} 
                        fill={style.chartFill} 
                        stroke="#000000" 
                        strokeWidth={2} 
                      />
                    );
                  })}
                </Scatter>
              </ScatterChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    function ExperimentList({ filteredList, search, setSearch, selectedExp, setSelectedExp }) {
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop flex-1">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
            <h3 className="text-base font-extrabold text-black">
              Experimental Runs ({filteredList.length})
            </h3>
            <div className="relative w-full sm:w-60">
              <input
                type="text"
                placeholder="Search material or test..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="bg-cream-100 border-2 border-black rounded-full pl-9 pr-4 py-1.5 text-xs text-black placeholder-slate-500 font-bold outline-none focus:bg-white w-full shadow-pop-sm"
              />
              <SearchIcon className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-600" />
            </div>
          </div>

          <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
            {filteredList.map((exp) => {
              const risk = calculateRisk(exp);
              const pop = getPopStyle(risk);
              const isSelected = selectedExp.id === exp.id;
              return (
                <div
                  key={exp.id}
                  onClick={() => setSelectedExp(exp)}
                  className={`p-4 rounded-2xl border-2 border-black cursor-pointer pop-btn flex items-center justify-between gap-3 ${
                    isSelected 
                      ? 'bg-popyellow shadow-pop' 
                      : 'bg-white shadow-pop-sm hover:bg-cream-100'
                  }`}
                >
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-[10px] font-mono font-black px-2 py-0.5 rounded bg-black text-white">
                        {exp.id}
                      </span>
                      <span className="text-xs font-extrabold text-black truncate">
                        {exp.title}
                      </span>
                    </div>
                    <p className="text-xs text-slate-800 font-semibold truncate">
                      {exp.fuel_material}{exp.oxygen_pct != null ? ` · ${exp.oxygen_pct}% O₂` : ''}{exp.airflow_cms != null ? ` · ${exp.airflow_cms} cm/s` : ''}{!exp.oxygen_pct && !exp.airflow_cms && exp.fuel_state ? ` · ${exp.fuel_state} fuel` : ''}
                    </p>
                  </div>

                  <span className={`text-[10px] font-black px-2.5 py-1 rounded-full whitespace-nowrap ${pop.badgeBg}`}>
                    {pop.tag}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function DossierCard({ selectedExp }) {
      if (!selectedExp) return null;
      const tags = selectedExp.tags || [];
      const findings = selectedExp.key_findings || [];
      const tests = selectedExp.tests || [];
      const gaps = selectedExp.data_gaps || [];
      const sources = selectedExp.sources || [];
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop">
          <div className="flex items-center justify-between border-b-2 border-black pb-3 mb-3">
            <span className="text-xs font-black uppercase tracking-wider text-black flex items-center gap-1.5">
              <ShieldAlertIcon className="w-4 h-4 text-black" />
              Active Specimen
            </span>
            <span className="text-xs font-mono font-bold bg-cream-200 px-2 py-0.5 rounded border border-black">
              {selectedExp.id}
            </span>
          </div>

          <h4 className="text-base font-extrabold text-black mb-3">{selectedExp.title}</h4>
          
          {/* Tags */}
          {tags.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mb-3">
              {tags.map((tag, i) => (
                <span key={i} className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-poplavender border border-black">
                  {tag.replace(/_/g, ' ')}
                </span>
              ))}
              {selectedExp.psi_listed && (
                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-popgreen border border-black">
                  PSI Listed
                </span>
              )}
            </div>
          )}

          {/* Summary */}
          {selectedExp.summary && (
            <p className="text-xs text-slate-700 font-medium leading-relaxed mb-3 italic">
              {selectedExp.summary}
            </p>
          )}
          
          {/* Core conditions */}
          <div className="bg-cream-100 p-4 rounded-2xl border-2 border-black space-y-2 text-xs font-medium text-slate-800 mb-3">
            <div><strong>Fuel:</strong> {selectedExp.fuel_material || 'Solid Specimen'}{selectedExp.fuel_state ? ` (${selectedExp.fuel_state})` : ''}</div>
            <div><strong>Platform:</strong> {selectedExp.facility_platform || 'Spacecraft Platform'}</div>
            {selectedExp.hardware && <div><strong>Hardware:</strong> {selectedExp.hardware}</div>}
            {selectedExp.oxygen_pct != null && <div><strong>O₂:</strong> {selectedExp.oxygen_pct}%{selectedExp.pressure_kpa != null ? ` at ${selectedExp.pressure_kpa} kPa` : ''}</div>}
            {selectedExp.airflow_cms != null && <div><strong>Airflow:</strong> {selectedExp.airflow_cms} cm/s</div>}
            {selectedExp.flame_spread_rate_mms != null && <div><strong>Flame Length:</strong> {selectedExp.flame_spread_rate_mms} cm</div>}
            {selectedExp.sensors && <div><strong>Sensors:</strong> {selectedExp.sensors}</div>}
            <div><strong>Extinction / Behavior:</strong> {selectedExp.extinction_behavior || 'Controlled test conditions'}</div>
          </div>

          {/* Key Findings */}
          {findings.length > 0 && (
            <div className="bg-popgreen/40 p-3 rounded-xl border border-black mb-3">
              <div className="text-[10px] font-black uppercase tracking-wider text-emerald-900 mb-1.5">Key Findings</div>
              <ul className="space-y-1">
                {findings.map((f, i) => (
                  <li key={i} className="text-xs text-slate-800 font-medium flex gap-1.5">
                    <span className="text-emerald-700 font-bold mt-0.5">→</span>
                    <span>{f}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* Test Samples */}
          {tests.length > 0 && (
            <div className="bg-cream-100 p-3 rounded-xl border border-black mb-3">
              <div className="text-[10px] font-black uppercase tracking-wider text-slate-700 mb-1.5">Test Samples</div>
              {tests.map((t, i) => (
                <div key={i} className="text-xs text-slate-800 font-medium mb-1">
                  <span className="font-mono font-bold bg-black text-white px-1.5 py-0.5 rounded text-[10px] mr-1.5">{t.sample}</span>
                  {t.material}{t.o2 ? ` · ${t.o2}% O₂` : ''}{t.flow ? ` · ${t.flow} cm/s` : ''}{t.direction ? ` · ${t.direction}` : ''}
                  {t.result && <span className="block text-slate-600 ml-8 mt-0.5">→ {t.result}</span>}
                </div>
              ))}
            </div>
          )}

          {/* Data Gaps */}
          {gaps.length > 0 && (
            <div className="bg-rose-50 p-3 rounded-xl border border-black mb-3">
              <div className="text-[10px] font-black uppercase tracking-wider text-rose-800 mb-1">Data Gaps</div>
              {gaps.map((g, i) => (
                <div key={i} className="text-xs text-rose-700 font-medium">⚠ {g}</div>
              ))}
            </div>
          )}

          {/* Fire Relevance */}
          {selectedExp.fire_relevance && (
            <div className="text-xs text-slate-700 font-semibold mb-3">
              <strong>Fire Safety Relevance:</strong> {selectedExp.fire_relevance}
            </div>
          )}

          {/* Source links */}
          <div className="space-y-2">
            {sources.length > 0 ? sources.filter(s => s.url).map((s, i) => (
              <a 
                key={i}
                href={s.url} 
                target="_blank" 
                rel="noreferrer"
                className="pop-btn inline-flex items-center justify-center gap-2 w-full py-2 rounded-full bg-black text-white text-xs font-extrabold shadow-pop-sm"
              >
                <span className="truncate">{s.title || 'NASA Report'}</span>
                <span className="text-[10px] text-slate-300 font-mono">({s.type || 'link'})</span>
                <ExternalLinkIcon className="w-3.5 h-3.5 flex-shrink-0" />
              </a>
            )) : (
              <a 
                href={selectedExp.source_report || '#'} 
                target="_blank" 
                rel="noreferrer"
                className="pop-btn inline-flex items-center justify-center gap-2 w-full py-2.5 rounded-full bg-black text-white text-xs font-extrabold shadow-pop"
              >
                <span>Open Official NASA Research Report</span>
                <ExternalLinkIcon className="w-3.5 h-3.5" />
              </a>
            )}
          </div>
        </div>
      );
    }

    function AiCopilotCard({ chatMessages, question, setQuestion, handleAsk, triggerMove, isQuerying }) {
      const chatEndRef = React.useRef(null);
      useEffect(() => {
        if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop flex-1 flex flex-col">
          <div className="flex items-center justify-between mb-3 pb-3 border-b-2 border-black">
            <div className="flex items-center gap-2">
              <BotIcon className="w-5 h-5 text-black" />
              <h4 className="text-sm font-black text-black uppercase tracking-wide">
                IGNIS AI Research Assistant
              </h4>
            </div>
            {isQuerying && (
              <span className="text-[10px] font-mono font-bold bg-popyellow px-2 py-0.5 rounded border border-black animate-pulse">
                SYNTHESIZING...
              </span>
            )}
          </div>

          {/* Chat Messages */}
          <div className="flex-1 bg-cream-100 rounded-2xl p-4 border-2 border-black mb-3 overflow-y-auto max-h-[340px] space-y-3">
            {chatMessages.map((msg, i) => (
              <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-xs font-medium leading-relaxed ${
                  msg.role === 'user'
                    ? 'bg-popyellow text-black border-2 border-black shadow-pop-sm rounded-br-sm'
                    : 'bg-white text-slate-800 border-2 border-black shadow-pop-sm rounded-bl-sm'
                }`}>
                  {msg.role === 'assistant' && (
                    <div className="flex items-center gap-1.5 mb-1">
                      <FlameIcon className="w-3 h-3 text-black" />
                      <span className="text-[10px] font-black text-black uppercase">IGNIS</span>
                    </div>
                  )}
                  <p className="whitespace-pre-line">{msg.text}</p>
                  {msg.sources && msg.sources.length > 0 && (
                    <div className="pt-1.5 mt-1.5 border-t border-black/10">
                      <span className="text-[10px] font-black text-slate-500 uppercase">Sources: </span>
                      <span className="text-[10px] font-mono font-bold text-slate-600">{msg.sources.join(', ')}</span>
                    </div>
                  )}
                </div>
              </div>
            ))}
            <div ref={chatEndRef} />
          </div>

          {/* Quick-action Pills */}
          <div className="flex flex-wrap gap-2 mb-3">
            <button 
              onClick={() => triggerMove("How does airflow affect flame spread in microgravity?")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-popyellow border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <FlameIcon className="w-3.5 h-3.5 text-black" />
              <span>Flame Spread</span>
            </button>
            <button 
              onClick={() => triggerMove("Compare Saffire-IV and Saffire-V experiments.")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-rose-200 border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <FireBlastIcon className="w-3.5 h-3.5 text-black" />
              <span>Compare</span>
            </button>
            <button 
              onClick={() => triggerMove("What are cool flames and why do they matter in space?")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-amber-200 border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <FireSparkleIcon className="w-3.5 h-3.5 text-amber-900" />
              <span>Cool Flames</span>
            </button>
            <button 
              onClick={() => triggerMove("How does oxygen level affect fire danger in spacecraft?")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-poplavender border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <DropletIcon className="w-3.5 h-3.5 text-indigo-700" />
              <span>O₂ Effects</span>
            </button>
          </div>

          {/* Question Form */}
          <form onSubmit={(e) => handleAsk(e, question)} className="flex items-center gap-2">
            <input
              type="text"
              value={question}
              onChange={(e) => setQuestion(e.target.value)}
              placeholder="Ask about microgravity combustion..."
              disabled={isQuerying}
              className="flex-1 bg-cream-100 border-2 border-black rounded-full px-4 py-2 text-xs font-bold text-black placeholder-slate-500 outline-none focus:bg-white shadow-pop-sm disabled:opacity-50"
            />
            <button
              type="submit"
              disabled={isQuerying}
              className="pop-btn bg-popyellow text-black px-5 py-2 rounded-full text-xs font-black border-2 border-black shadow-pop flex items-center gap-1 disabled:opacity-50"
            >
              <span>{isQuerying ? '...' : 'Ask'}</span>
            </button>
          </form>
        </div>
      );
    }

    function Footer() {
      return (
        <footer className="mt-12 flex flex-wrap items-center justify-between gap-4 pt-6 border-t-2 border-black/10">
          <div className="flex items-center gap-2">
            <span className="text-xs font-bold text-black">NASA IGNIS SFS Project</span>
            <span className="text-xs text-slate-500">·</span>
            <span className="text-xs text-slate-600 font-medium">BASS, Saffire, FLEX-2, SoFIE/MIST Missions</span>
          </div>

          <div className="flex items-center gap-2">
            <a href="https://twitter.com" target="_blank" rel="noreferrer" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="X (Twitter)">
              <TwitterIcon className="w-3.5 h-3.5 text-black" />
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noreferrer" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="LinkedIn">
              <LinkedinIcon className="w-3.5 h-3.5 text-black" />
            </a>
            <a href="https://github.com" target="_blank" rel="noreferrer" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="GitHub">
              <GithubIcon className="w-3.5 h-3.5 text-black" />
            </a>
            <a href="mailto:contact@nasa.gov" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="Contact Email">
              <MailIcon className="w-3.5 h-3.5 text-black" />
            </a>
          </div>
        </footer>
      );
    }

    function App() {
      const [experiments, setExperiments] = useState(DEFAULT_EXPERIMENTS);
      const [search, setSearch] = useState('');
      const [filter, setFilter] = useState('ALL');
      const [selectedExp, setSelectedExp] = useState(DEFAULT_EXPERIMENTS[0]);
      const [question, setQuestion] = useState('');
      const [isQuerying, setIsQuerying] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        {
          role: 'assistant',
          text: "Welcome to IGNIS! I'm your AI research assistant for NASA microgravity fire safety data. I have access to 23 investigations spanning programs like Saffire, BASS, FLEX, SoFIE, and ACME.\n\nYou can ask me about specific experiments, compare conditions, or explore how fire behaves differently in space. Try the quick-action buttons below, or type your own question!",
          sources: []
        }
      ]);

      // Load live investigations.json — preserves ALL rich fields
      useEffect(() => {
        fetch('investigations.json')
          .then(res => res.ok ? res.json() : null)
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              const mapped = data.map(mapInvestigation);
              setExperiments(mapped);
              setSelectedExp(mapped[0]);
            }
          })
          .catch(() => {
            // Keep default experiments if fetch fails
          });
      }, []);

      const filteredList = useMemo(() => {
        return experiments.filter(item => {
          const fuel = (item.fuel_material || item.fuel || '').toLowerCase();
          const title = (item.title || item.name || '').toLowerCase();
          const q = search.toLowerCase();
          const matchesSearch = fuel.includes(q) || title.includes(q);
          const prog = item.mission_program || item.prog || '';
          const matchesFilter = filter === 'ALL' || prog.toLowerCase().includes(filter.toLowerCase());
          return matchesSearch && matchesFilter;
        }).sort((a, b) => calculateRisk(b) - calculateRisk(a));
      }, [experiments, search, filter]);

      const chartData = useMemo(() => {
        return filteredList.filter(hasNumericData).map(item => ({
          x: Number(item.airflow_cms) || 0,
          y: Number(item.flame_spread_rate_mms) || 0,
          z: calculateRisk(item),
          item: item
        }));
      }, [filteredList]);

      // Connects to backend /api/chat with conversation history
      const processQuery = async (queryText) => {
        const q = queryText.trim();
        if (!q) return;

        // Add user message to chat
        const userMsg = { role: 'user', text: q };
        setChatMessages(prev => [...prev, userMsg]);
        setIsQuerying(true);

        try {
          // Build history from recent messages for context
          const recentHistory = chatMessages.slice(-6).map(m => ({
            role: m.role === 'assistant' ? 'assistant' : 'user',
            text: m.text
          }));

          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: q, history: recentHistory })
          });

          if (res.ok) {
            const data = await res.json();
            if (data.answer) {
              setChatMessages(prev => [...prev, {
                role: 'assistant',
                text: data.answer,
                sources: data.sources || []
              }]);
              setIsQuerying(false);
              return;
            }
          }
        } catch (err) {
          console.warn("Backend chat unavailable, using local synthesis:", err);
        }

        // Local fallback synthesis if backend is unavailable
        const lower = q.toLowerCase();
        let fallbackText = '';
        if (lower.match(/^(hi|hello|hey|howdy|good\s)/)) {
          fallbackText = "Hello! I'm IGNIS, your microgravity fire research assistant. I'm currently in offline mode, but I can still help you explore the experiment data loaded in the dashboard. Try clicking on different experiments or using the quick-action buttons!";
        } else if (lower.includes('saffire')) {
          fallbackText = "The Saffire series (I through V) conducted large-scale fire tests aboard Cygnus free-flyers. Key findings: flame spread is steady (not accelerating) in microgravity, and airflow velocity directly controls flame size. Saffire-V tested exploration atmospheres at 26.2% O2 and 70.7 kPa, showing thin fuels can keep burning without airflow at higher O2.\n\n[SAFFIRE-I] [SAFFIRE-III] [SAFFIRE-V]";
        } else if (lower.includes('cool flame') || lower.includes('flex') || lower.includes('droplet')) {
          fallbackText = "Cool flames are low-temperature combustion that can continue invisibly after visible flames extinguish. The FLEX and FLEX-2 droplet combustion experiments, along with CFI (Cool Flames Investigation), study this phenomenon using the MDCA apparatus in the CIR on ISS.\n\n[FLEX] [FLEX-2] [CFI]";
        } else if (lower.includes('oxygen') || lower.includes('o2')) {
          fallbackText = "Oxygen concentration is a critical fire safety parameter. The dataset spans from 18% O2 (SoFIE-MIST) to 85% O2 (ACME CFI-G). Saffire-V tested exploration atmospheres at 26.2% O2 / 70.7 kPa. Higher oxygen levels increase flame size and persistence.\n\n[SAFFIRE-V] [SoFIE-MIST] [ACME-CFI-G]";
        } else {
          fallbackText = `I'm currently in offline mode, so I can provide only basic information. Your question about "${q}" would be best answered when connected to the full AI backend. In the meantime, explore the experiment cards and scatter plot for data-driven insights!`;
        }

        setChatMessages(prev => [...prev, {
          role: 'assistant',
          text: fallbackText,
          sources: []
        }]);
        setIsQuerying(false);
      };

      const handleAsk = (e, customQuery) => {
        if (e) e.preventDefault();
        const queryToRun = customQuery || question;
        if (!queryToRun.trim()) return;
        processQuery(queryToRun);
        setQuestion('');
      };

      const triggerMove = (moveName) => {
        processQuery(moveName);
      };

      return (
        <div className="max-w-[1340px] mx-auto px-4 py-8 md:px-8">
          <Header 
            filter={filter} 
            setFilter={setFilter} 
            onTriggerAi={() => {
              processQuery("Give me a quick overview of fire safety research in microgravity.");
            }}
          />

          <HeroSection 
            selectedExp={selectedExp} 
            setQuestion={setQuestion} 
            totalExperiments={experiments.length}
          />

          <div id="dataset-matrix" className="grid grid-cols-12 gap-6">
            <div className="col-span-12 lg:col-span-7 flex flex-col gap-6">
              <AiCopilotCard 
                chatMessages={chatMessages}
                question={question}
                setQuestion={setQuestion}
                handleAsk={handleAsk}
                triggerMove={triggerMove}
                isQuerying={isQuerying}
              />
              <ScatterPlotCard 
                chartData={chartData} 
                setSelectedExp={setSelectedExp} 
              />
            </div>

            <div className="col-span-12 lg:col-span-5 flex flex-col gap-6">
              <DossierCard selectedExp={selectedExp} />
              <ExperimentList 
                filteredList={filteredList}
                search={search}
                setSearch={setSearch}
                selectedExp={selectedExp}
                setSelectedExp={setSelectedExp}
              />
            </div>
          </div>

          <Footer />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
