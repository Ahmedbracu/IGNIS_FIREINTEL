    function calculateRisk(item) {
      const score = (item.oxygen_pct * 0.12) + (item.flame_spread_rate_mms * 1.3) + (item.airflow_cms * 0.03);
      return Math.min(10, Math.max(1, parseFloat(score.toFixed(1))));
    }

    function getPopStyle(score) {
      if (score >= 6.5) return { 
        badgeBg: 'bg-rose-100 text-black border-2 border-black shadow-pop-sm', 
        tag: 'CRITICAL',
        chartFill: '#FF4D6D' 
      };
      if (score >= 4.0) return { 
        badgeBg: 'bg-popyellow text-black border-2 border-black shadow-pop-sm', 
        tag: 'ELEVATED',
        chartFill: '#FFE600' 
      };
      return { 
        badgeBg: 'bg-popmint text-black border-2 border-black shadow-pop-sm', 
        tag: 'NOMINAL',
        chartFill: '#2EC4B6' 
      };
    }

                <div className="text-3xl font-black mb-1 flex items-center justify-center gap-1">
                  {selectedExp.flame_spread_rate_mms} 
                  <span className="text-xs font-normal text-slate-300">mm/s</span>
                </div>
                <div className="text-xs font-bold text-slate-300 truncate mb-3">{selectedExp.fuel_material}</div>
                <div className="inline-block bg-popyellow text-black text-[11px] font-extrabold px-3 py-1 rounded-full border border-black">
                  {selectedExp.mission_program} Platform
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ScatterPlotCard({ chartData, setSelectedExp }) {
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
            <div>
              <h3 className="text-base font-extrabold text-black flex items-center gap-2">
                <WindIcon className="w-4 h-4 text-black" />
                Combustion Propagation Matrix
              </h3>
              <p className="text-xs font-semibold text-slate-600">Airflow Velocity (cm/s) vs. Flame Spread Rate (mm/s)</p>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-popmint border border-black">Low Risk</span>
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-popyellow border border-black">Elevated</span>
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-200 border border-black">Critical</span>
            </div>
          </div>

          <div className="h-64 w-full bg-cream-100 rounded-2xl p-2 border-2 border-black">
            <ResponsiveContainer width="100%" height="100%">
              <ScatterChart margin={{ top: 15, right: 20, bottom: 20, left: -10 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#DDD9CD" />
                <XAxis 
                  type="number" 
                  dataKey="x" 
                  name="Flow" 
                  unit=" cm/s" 
                  stroke="#111" 
                  fontSize={11} 
                  fontWeight={700}
                  domain={[0, 30]} 
                />
                <YAxis 
                  type="number" 
                  dataKey="y" 
                  name="Spread" 
                  unit=" mm/s" 
                  stroke="#111" 
                  fontSize={11} 
                  fontWeight={700}
                  domain={[0, 5]} 
                />
                <ZAxis type="number" dataKey="z" range={[120, 340]} />
                <Tooltip 
                  content={({ active, payload }) => {
                    if (active && payload && payload.length) {
                      const point = payload[0].payload.item;
                      return (
                        <div className="bg-white border-2 border-black p-3 rounded-xl shadow-pop text-xs">
                          <div className="font-extrabold text-black">{point.title}</div>
                          <div className="text-slate-700 mt-1">Airflow: <strong>{point.airflow_cms} cm/s</strong></div>
                          <div className="text-slate-700">Spread: <strong>{point.flame_spread_rate_mms} mm/s</strong></div>
                          <div className="text-slate-700">O₂ Level: <strong>{point.oxygen_pct}%</strong></div>
                        </div>
                      );
                    }
                    return null;
                  }} 
                />
                <Scatter 
                  data={chartData} 
                  onClick={(node) => setSelectedExp(node.item)}
                  cursor="pointer"
                >
                  {chartData.map((entry, index) => {
                    const style = getPopStyle(entry.z);
                    return (
                      <Cell 
                        key={`cell-${index}`} 
                        fill={style.chartFill} 
                        stroke="#000000" 
                        strokeWidth={2} 
                      />
                    );
                  })}
                </Scatter>
              </ScatterChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    }

    function ExperimentList({ filteredList, search, setSearch, selectedExp, setSelectedExp }) {
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop flex-1">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
            <h3 className="text-base font-extrabold text-black">
              Experimental Runs ({filteredList.length})
            </h3>
            <div className="relative w-full sm:w-60">
              <input
                type="text"
                placeholder="Search material or test..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                className="bg-cream-100 border-2 border-black rounded-full pl-9 pr-4 py-1.5 text-xs text-black placeholder-slate-500 font-bold outline-none focus:bg-white w-full shadow-pop-sm"
              />
              <SearchIcon className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-600" />
            </div>
          </div>

          <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
            {filteredList.map((exp) => {
              const risk = calculateRisk(exp);
              const pop = getPopStyle(risk);
              const isSelected = selectedExp.id === exp.id;
              return (
                <div
                  key={exp.id}
                  onClick={() => setSelectedExp(exp)}
                  className={`p-4 rounded-2xl border-2 border-black cursor-pointer pop-btn flex items-center justify-between gap-3 ${
                    isSelected 
                      ? 'bg-popyellow shadow-pop' 
                      : 'bg-white shadow-pop-sm hover:bg-cream-100'
                  }`}
                >
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-[10px] font-mono font-black px-2 py-0.5 rounded bg-black text-white">
                        {exp.id}
                      </span>
                      <span className="text-xs font-extrabold text-black truncate">
                        {exp.title}
                      </span>
                    </div>
                    <p className="text-xs text-slate-800 font-semibold truncate">
                      {exp.fuel_material} · {exp.oxygen_pct}% O₂ · {exp.airflow_cms} cm/s
                    </p>
                  </div>

                  <span className={`text-[10px] font-black px-2.5 py-1 rounded-full whitespace-nowrap ${pop.badgeBg}`}>
                    {pop.tag}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function DossierCard({ selectedExp }) {
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop">
          <div className="flex items-center justify-between border-b-2 border-black pb-3 mb-3">
            <span className="text-xs font-black uppercase tracking-wider text-black flex items-center gap-1.5">
              <ShieldAlertIcon className="w-4 h-4 text-black" />
              Active Specimen
            </span>
            <span className="text-xs font-mono font-bold bg-cream-200 px-2 py-0.5 rounded border border-black">
              {selectedExp.id}
            </span>
          </div>

          <h4 className="text-base font-extrabold text-black mb-3">{selectedExp.title}</h4>
          
          <div className="bg-cream-100 p-4 rounded-2xl border-2 border-black space-y-2 text-xs font-medium text-slate-800 mb-4">
            <div><strong>Fuel:</strong> {selectedExp.fuel_material}</div>
            <div><strong>Platform:</strong> {selectedExp.facility_platform}</div>
            <div><strong>Extinction Behavior:</strong> {selectedExp.extinction_behavior}</div>
          </div>

          <a 
            href={selectedExp.source_report} 
            target="_blank" 
            rel="noreferrer"
            className="pop-btn inline-flex items-center justify-center gap-2 w-full py-2.5 rounded-full bg-black text-white text-xs font-extrabold shadow-pop"
          >
            <span>Open Official NASA Research Report</span>
            <ExternalLinkIcon className="w-3.5 h-3.5" />
          </a>
        </div>
      );
    }

    function AiCopilotCard({ aiNote, question, setQuestion, handleAsk, triggerMove }) {
      return (
        <div className="bg-white p-6 rounded-3xl border-2 border-black shadow-pop flex-1 flex flex-col">
          <div className="flex items-center gap-2 mb-3 pb-3 border-b-2 border-black">
            <BotIcon className="w-5 h-5 text-black" />
            <h4 className="text-sm font-black text-black uppercase tracking-wide">
              NASA AI Synthesis Agent
            </h4>
          </div>

          {/* Copilot Bubble */}
          <div className="flex-1 bg-cream-100 rounded-2xl p-4 border-2 border-black mb-3 overflow-y-auto">
            <h5 className="text-xs font-black text-black mb-1.5">{aiNote.headline}</h5>
            <p className="text-xs text-slate-800 font-medium leading-relaxed mb-3">{aiNote.body}</p>
            <div className="pt-2 border-t border-black/20">
              <span className="text-[10px] font-black text-slate-600 uppercase tracking-wider block mb-1">Source Citation</span>
              <p className="text-[11px] font-mono font-bold text-slate-900">{aiNote.citation}</p>
            </div>
          </div>

          {/* Fire-type move SVG Pills */}
          <div className="flex flex-wrap gap-2 mb-3">
            <button 
              onClick={() => triggerMove("flamethrower")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-popyellow border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <FlameIcon className="w-3.5 h-3.5 text-black" />
              <span>Flamethrower</span>
            </button>
            <button 
              onClick={() => triggerMove("overheat")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-rose-200 border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <FireBlastIcon className="w-3.5 h-3.5 text-black" />
              <span>Overheat</span>
            </button>
            <button 
              onClick={() => triggerMove("ember")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-amber-200 border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <FireSparkleIcon className="w-3.5 h-3.5 text-amber-900" />
              <span>Ember</span>
            </button>
            <button 
              onClick={() => triggerMove("cool flames")}
              className="pop-btn text-[11px] font-bold px-3 py-1 rounded-full bg-poplavender border-2 border-black shadow-pop-sm flex items-center gap-1.5 text-black"
            >
              <DropletIcon className="w-3.5 h-3.5 text-indigo-700" />
              <span>Cool Flames</span>
            </button>
          </div>

          {/* Question Form */}
          <form onSubmit={(e) => handleAsk(e, question)} className="flex items-center gap-2">
            <input
              type="text"
              value={question}
              onChange={(e) => setQuestion(e.target.value)}
              placeholder="Ask about microgravity combustion..."
              className="flex-1 bg-cream-100 border-2 border-black rounded-full px-4 py-2 text-xs font-bold text-black placeholder-slate-500 outline-none focus:bg-white shadow-pop-sm"
            />
            <button
              type="submit"
              className="pop-btn bg-popyellow text-black px-5 py-2 rounded-full text-xs font-black border-2 border-black shadow-pop flex items-center gap-1"
            >
              <span>Ask</span>
            </button>
          </form>
        </div>
      );
    }

    function Footer() {
      return (
        <footer className="mt-12 flex flex-wrap items-center justify-between gap-4 pt-6 border-t-2 border-black/10">
          <div className="flex items-center gap-2">
            <span className="text-xs font-bold text-black">NASA IGNIS SFS Project</span>
            <span className="text-xs text-slate-500">·</span>
            <span className="text-xs text-slate-600 font-medium">BASS, Saffire, FLEX-2, SoFIE/MIST Missions</span>
          </div>

          <div className="flex items-center gap-2">
            <a href="https://twitter.com" target="_blank" rel="noreferrer" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="X (Twitter)">
              <TwitterIcon className="w-3.5 h-3.5 text-black" />
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noreferrer" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="LinkedIn">
              <LinkedinIcon className="w-3.5 h-3.5 text-black" />
            </a>
            <a href="https://github.com" target="_blank" rel="noreferrer" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="GitHub">
              <GithubIcon className="w-3.5 h-3.5 text-black" />
            </a>
            <a href="mailto:contact@nasa.gov" className="w-8 h-8 rounded-full border-2 border-black bg-white flex items-center justify-center shadow-pop-sm hover:bg-popyellow transition-colors" title="Contact Email">
              <MailIcon className="w-3.5 h-3.5 text-black" />
            </a>
          </div>
        </footer>
      );
    }

    function App() {
      const [search, setSearch] = useState('');
      const [filter, setFilter] = useState('ALL');
      const [selectedExp, setSelectedExp] = useState(EXPERIMENTS_DATA[0]);
      const [question, setQuestion] = useState('');
      const [aiNote, setAiNote] = useState({
        headline: "NASA Fire Safety Telemetry Initialized",
        body: "Microgravity eliminates buoyant upward drafting. Fires burn spherically and rely directly on spacecraft ventilation speeds. Select any mission run or ask a question below.",
        citation: "NASA Glenn Research Center — Microgravity Combustion Database"
      });

      const filteredList = useMemo(() => {
        return EXPERIMENTS_DATA.filter(item => {
          const matchesSearch = item.fuel_material.toLowerCase().includes(search.toLowerCase()) ||
                                item.title.toLowerCase().includes(search.toLowerCase());
          const matchesFilter = filter === 'ALL' || item.mission_program.includes(filter);
          return matchesSearch && matchesFilter;
        }).sort((a, b) => calculateRisk(b) - calculateRisk(a));
      }, [search, filter]);

      const chartData = useMemo(() => {
        return filteredList.map(item => ({
          x: item.airflow_cms,
          y: item.flame_spread_rate_mms,
          z: calculateRisk(item),
          item: item
        }));
      }, [filteredList]);

      const processQuery = (queryText) => {
        const q = queryText.toLowerCase();
        if (!q.trim()) return;

        if (q.includes("flamethrower")) {
          setAiNote({
            headline: "Flamethrower Hydrodynamics in Zero-G",
            body: "Under forced airflow (15–25 cm/s), low-gravity flames exhibit jet-like momentum similar to a Flamethrower, forming extended reaction zones that bypass self-extinction limits.",
            citation: "NASA Microgravity Fire Safety — Forced Convection Jet Analysis"
          });
        } else if (q.includes("overheat") || q.includes("thermal")) {
          setAiNote({
            headline: "Overheat Thermal Accumulation",
            body: "Without buoyant convection to carry heat away, non-vented materials undergo rapid localized thermal buildup ('Overheat'), causing sudden off-gassing and intense flammability spikes.",
            citation: "NASA Spacecraft Fire Safety Handbook — Thermal Runaway Studies"
          });
        } else if (q.includes("ember") || q.includes("smolder")) {
          setAiNote({
            headline: "Ember Smoldering Dynamics",
            body: "Microgravity embers can stay hot for extended periods in low-oxygen environments. When HVAC air recirculation resumes, dormant embers rapidly reignite into active flames.",
            citation: "ISS Microgravity Science Glovebox — Smoldering Solids Research"
          });
        } else if (q.includes("cool") || q.includes("droplet") || q.includes("flex")) {
          setAiNote({
            headline: "Low-Temperature Cool Flames Detected",
            body: "In the FLEX-2 droplet tests, hot soot extinction was followed by an invisible low-temperature combustion regime. This produces significant carbon monoxide with zero visible light in microgravity.",
            citation: "NASA Glenn Research Center / FLEX-2 MDCA Experiment"
          });
        } else if (q.includes("saffire") || q.includes("large") || q.includes("speed")) {
          setAiNote({
            headline: "Forced Convection Feeds Flame Fronts",
            body: "Saffire-I through IV proved that while large fabric burns extinguish when airflow stops, forced velocities of 20-25 cm/s supply ample oxidizer, driving propagation speeds up to 4.8 mm/s.",
            citation: "Urban, D. et al., Saffire Series, NASA NTRS"
          });
        } else if (q.includes("pmma") || q.includes("radiation") || q.includes("sofie")) {
          setAiNote({
            headline: "Radiative Flux Weakens Extinction Limits",
            body: "SoFIE-MIST confirmed that external radiant heating (1.9 kW/m²) forces PMMA plastics to burn at oxygen levels as low as 18%, counteracting the quenching typically caused by microgravity.",
            citation: "NASA SoFIE Science Team / ISS CIR Facility"
          });
        } else {
          setAiNote({
            headline: "Convection-Dominant Extinction",
            body: `Analyzing records for "${queryText}": Because buoyancy is zero in microgravity, flame persistence and smoke accumulation depend directly on HVAC airflow velocity.`,
            citation: filteredList[0]?.nasa_citation || "NASA Materials & Fire Safety Group"
          });
        }
      };

      const handleAsk = (e, customQuery) => {
        if (e) e.preventDefault();
        const queryToRun = customQuery || question;
        processQuery(queryToRun);
        setQuestion('');
      };

      const triggerMove = (moveName) => {
        setQuestion(moveName);
        processQuery(moveName);
      };

      return (
        <div className="max-w-[1340px] mx-auto px-4 py-8 md:px-8">
          <Header 
            filter={filter} 
            setFilter={setFilter} 
            onTriggerAi={() => {
              setAiNote({
                headline: "Spacecraft Fire Safety Assessment",
                body: "In microgravity environments, forced convection from HVAC systems dictates flame spread rates. Fire detection relies heavily on early optical and carbon monoxide sensors rather than traditional ceiling smoke detectors.",
                citation: "NASA Spacecraft Fire Safety Operations Guide"
              });
            }}
          />

          <HeroSection 
            selectedExp={selectedExp} 
            setQuestion={setQuestion} 
          />

          <div id="dataset-matrix" className="grid grid-cols-12 gap-6">
            <div className="col-span-12 lg:col-span-7 flex flex-col gap-6">
              <AiCopilotCard 
                aiNote={aiNote}
                question={question}
                setQuestion={setQuestion}
                handleAsk={handleAsk}
                triggerMove={triggerMove}
              />
              <ScatterPlotCard 
                chartData={chartData} 
                setSelectedExp={setSelectedExp} 
              />
            </div>

            <div className="col-span-12 lg:col-span-5 flex flex-col gap-6">
              <DossierCard selectedExp={selectedExp} />
              <ExperimentList 
                filteredList={filteredList}
                search={search}
                setSearch={setSearch}
                selectedExp={selectedExp}
                setSelectedExp={setSelectedExp}
              />
            </div>
          </div>

          <Footer />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
